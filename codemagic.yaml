workflows:
  trueohm-readonly-audit:
    name: TrueOhm Read-only Audit
    instance_type: mac_mini_m2
    max_build_duration: 30
    labels:
      - github
      - readonly
      - trueohm
    environment:
      xcode: latest
      node: 24
      cocoapods: default
      vars:
        PNPM_STORE_PATH: $CM_BUILD_DIR/.pnpm-store
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.pnpm-store
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: codex/app-growth-stage1-trueohm
          include: false
          source: true
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install pnpm and dependencies
        script: |
          npm install --global --force pnpm@9.15.9
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, and build web
        script: |
          set -euo pipefail
          pnpm lint
          pnpm -r typecheck
          pnpm -r test
          pnpm -r build
      - name: Sync Capacitor iOS target
        script: |
          set -euo pipefail
          cd apps/web
          npx cap sync ios

  trueohm-ios-screenshot-evidence:
    name: TrueOhm iOS Screenshot Evidence
    instance_type: mac_mini_m2
    max_build_duration: 29
    labels:
      - artifact-only
      - ios-simulator
      - manual
      - trueohm
    environment:
      xcode: 26.4
      node: 24
      cocoapods: default
      vars:
        PNPM_STORE_PATH: $CM_BUILD_DIR/.pnpm-store
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.pnpm-store
    scripts:
      - name: Install pnpm and dependencies
        script: |
          set -euo pipefail
          npm install --global --force pnpm@9.15.9
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
      - name: Run repository and storefront gates
        script: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm storefront:preflight
          node scripts/native-evidence-preflight.mjs
      - name: Sync the committed Capacitor iOS project cleanly
        script: |
          set -euo pipefail
          cd apps/web
          npx cap sync ios
          cd "$CM_BUILD_DIR"
          git diff --exit-code
      - name: Record source, Xcode, and exact simulator inventory
        script: |
          set -euo pipefail
          EVIDENCE_DIR="$CM_BUILD_DIR/native-evidence"
          mkdir -p "$EVIDENCE_DIR/logs"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-sha.txt"
          xcodebuild -version | tee "$EVIDENCE_DIR/xcode-version.txt"
          xcrun simctl list devices available --json > "$EVIDENCE_DIR/simulators.json"
          node scripts/native-evidence-preflight.mjs resolve-simulators "$EVIDENCE_DIR"
      - name: Capture five iPhone frames into an xcresult bundle
        script: |
          set -euo pipefail
          IPHONE_DESTINATION="$(node scripts/native-evidence-preflight.mjs destination "$CM_BUILD_DIR/native-evidence" iphone)"
          xcodebuild test -project apps/web/ios/App/App.xcodeproj -scheme App -configuration Debug -destination "$IPHONE_DESTINATION" -resultBundlePath "$CM_BUILD_DIR/native-evidence/trueohm-iphone.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$CM_BUILD_DIR/native-evidence/logs/iphone-xcodebuild.log"
      - name: Capture five iPad frames into an xcresult bundle
        script: |
          set -euo pipefail
          IPAD_DESTINATION="$(node scripts/native-evidence-preflight.mjs destination "$CM_BUILD_DIR/native-evidence" ipad)"
          xcodebuild test -project apps/web/ios/App/App.xcodeproj -scheme App -configuration Debug -destination "$IPAD_DESTINATION" -resultBundlePath "$CM_BUILD_DIR/native-evidence/trueohm-ipad.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$CM_BUILD_DIR/native-evidence/logs/ipad-xcodebuild.log"
      - name: Export, validate, name, and hash screenshot evidence
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/native-evidence/raw-iphone" "$CM_BUILD_DIR/native-evidence/raw-ipad"
          xcrun xcresulttool export attachments --path "$CM_BUILD_DIR/native-evidence/trueohm-iphone.xcresult" --output-path "$CM_BUILD_DIR/native-evidence/raw-iphone"
          xcrun xcresulttool export attachments --path "$CM_BUILD_DIR/native-evidence/trueohm-ipad.xcresult" --output-path "$CM_BUILD_DIR/native-evidence/raw-ipad"
          node scripts/native-evidence-preflight.mjs materialize "$CM_BUILD_DIR/native-evidence"
          test -f "$CM_BUILD_DIR/native-evidence/manifest.json"
          test -f "$CM_BUILD_DIR/native-evidence/sha256.txt"
    artifacts:
      - native-evidence/**/*

  trueohm-ios-testflight:
    name: TrueOhm iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    labels:
      - github
      - ios
      - testflight
      - trueohm
    integrations:
      app_store_connect: Codemagic_ASC_API
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fiveohninelectric.trueohm
      vars:
        APP_STORE_APPLE_ID: "6772605137"
        BUNDLE_ID: com.fiveohninelectric.trueohm
        XCODE_PROJECT: apps/web/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        PNPM_STORE_PATH: $CM_BUILD_DIR/.pnpm-store
      xcode: latest
      node: 24
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.pnpm-store
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install pnpm and dependencies
        script: |
          npm install --global --force pnpm@9.15.9
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, and build web
        script: |
          set -euo pipefail
          pnpm lint
          pnpm -r typecheck
          pnpm -r test
          pnpm -r build
      - name: Sync Capacitor iOS target
        script: |
          set -euo pipefail
          cd apps/web
          npx cap sync ios
      - name: Require App Store Connect app id
        script: |
          : "${APP_STORE_APPLE_ID:?Set APP_STORE_APPLE_ID in codemagic.yaml or Codemagic environment variables.}"
      - name: Set up provisioning profiles
        script: |
          # Automatic signing: upload the distribution provisioning profile to
          # Codemagic's Code Signing Identities store ("Fetch profiles") before
          # triggering a build. xcode-project use-profiles reads it from there.
          xcode-project use-profiles
      - name: Set build number
        script: |
          set -euo pipefail
          PROJECT_FILE="apps/web/ios/App/App.xcodeproj/project.pbxproj"
          INFO_PLIST="apps/web/ios/App/App/Info.plist"
          APP_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          export APP_BUILD_NUMBER
          perl -0pi -e 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $ENV{APP_BUILD_NUMBER};/g' "$PROJECT_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_NUMBER" "$INFO_PLIST"
          echo "Set iOS CFBundleVersion to $APP_BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - apps/web/ios/App/build/**/*.xcresult
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false

  trueohm-android:
    name: TrueOhm Android
    instance_type: mac_mini_m2
    max_build_duration: 45
    labels:
      - github
      - android
      - trueohm
    environment:
      java: 17
      node: 24
      vars:
        PNPM_STORE_PATH: $CM_BUILD_DIR/.pnpm-store
        # Release-AAB signing: create an Android keystore in Codemagic
        # (Teams > Code signing identities > Android keystores) and add an
        # `android_signing:` block referencing it to sign the release bundle for
        # Play upload. Until then this builds an UNSIGNED release AAB, which
        # validates the whole Android compile plus an installable debug APK.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.pnpm-store
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "android-*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Activate pnpm and install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
          pnpm config set store-dir "$PNPM_STORE_PATH"
          pnpm install --frozen-lockfile
      - name: Build web and sync Capacitor Android
        script: |
          set -euo pipefail
          pnpm -r build
          cd apps/web
          npx cap sync android
      - name: Build Android bundle (release AAB) + debug APK
        script: |
          set -euo pipefail
          cd apps/web/android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace
    artifacts:
      - apps/web/android/app/build/outputs/**/*.aab
      - apps/web/android/app/build/outputs/**/*.apk
